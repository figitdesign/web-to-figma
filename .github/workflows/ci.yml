name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        run: pnpm build

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm --filter @figit/dom-to-figma exec playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        run: pnpm --filter @figit/dom-to-figma exec playwright install chromium --with-deps

      - name: Test
        run: pnpm test

  parity:
    name: Tier-0 parity ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm --filter @figit/dom-to-figma exec playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        run: pnpm --filter @figit/dom-to-figma exec playwright install chromium --with-deps

      # Renders the corpus, runs the tier-0 diff, and fails if any scene
      # regresses against internal/oracle-harness/baseline/scoreboard.json.
      # No secrets — safe on fork PRs.
      - name: Parity ratchet
        run: pnpm oracle:parity

      - name: Upload run artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-run
          path: oracle/runs/parity
          retention-days: 7

  guard:
    name: Oracle PR guard
    runs-on: ubuntu-latest
    # Only autonomous PRs carry these labels; human PRs skip the guard entirely.
    if: >-
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'oracle-fix') ||
       contains(github.event.pull_request.labels.*.name, 'oracle-ledger'))
    steps:
      - uses: actions/checkout@v6
        with:
          # Need the base branch and merge-base for the guard's `git diff`.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # An autonomous PR may improve a number only by fixing the converter —
      # never by loosening a tolerance, editing the measurement code, or
      # un-parking a human-set finding. See internal/oracle-harness/src/guard.ts.
      - name: Enforce oracle PR rules
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags origin "$BASE"
          LABEL=oracle-ledger
          if ${{ contains(github.event.pull_request.labels.*.name, 'oracle-fix') }}; then
            LABEL=oracle-fix
          fi
          pnpm --filter @figit/oracle-harness run cli guard \
            --label "$LABEL" \
            --base "origin/$BASE"
