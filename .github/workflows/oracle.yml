name: Oracle

# The outer loop of the visual-parity pipeline (docs/visual-parity-pipeline.prd.md
# §WS-3.2). Manual-trigger only for now — the whole loop is run locally via the
# `cli` commands while the corpus is being built out. Re-enable unattended runs by
# adding a `schedule:` trigger here (e.g. `- cron: "0 6 * * *"`). It never runs on
# pull_request/push, so untrusted fork code never executes next to the secrets.
on:
  workflow_dispatch:
    inputs:
      max_turns:
        description: "Agent turn budget for the fix job"
        required: false
        default: "80"
      model:
        description: "Agent model (Claude Code --model)"
        required: false
        default: "claude-opus-4-8"

# Never overlap runs: a second run must not paste into the shared Figma file
# while the first is mid-capture, and must not race the ledger.
concurrency:
  group: oracle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Measure ──────────────────────────────────────────────────────────────
  # Convert the corpus, drive real Figma, diff Tiers 0–2, emit report.json.
  # Read-only w.r.t. the repo: it opens no PRs and commits nothing.
  measure:
    name: Measure parity (Tiers 0–2)
    runs-on: ubuntu-latest
    environment: oracle
    env:
      RUN_ID: run-${{ github.run_id }}
      FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
      # Base64-of-JSON storageState; the harness classifies and decodes it.
      FIGMA_STORAGE_STATE: ${{ secrets.FIGMA_STORAGE_STATE }}
      # Optional — only the WS-2.5 REST pixel fallback reads it.
      FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
    outputs:
      run_id: ${{ env.RUN_ID }}
      figma_auth: ${{ steps.figma_validate.outputs.auth }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: ./.github/actions/setup

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm --filter @figit/dom-to-figma exec playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        run: pnpm --filter @figit/dom-to-figma exec playwright install chromium --with-deps

      # Canary: a live session check that fails with a distinct, self-explanatory
      # surface when the stored Figma login has expired (exit 3), so a human
      # re-logs in rather than treating it as a pipeline regression.
      - name: Validate Figma session
        id: figma_validate
        run: |
          set +e
          pnpm --filter @figit/oracle-harness run cli figma validate
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "auth=expired" >> "$GITHUB_OUTPUT"
            echo "::error title=Figma session expired::Run \`cli figma login\` locally and update the FIGMA_STORAGE_STATE secret (base64)."
          else
            echo "auth=ok" >> "$GITHUB_OUTPUT"
          fi
          exit $code

      - name: Snapshot corpus (Tier 0)
        run: pnpm --filter @figit/oracle-harness run cli snapshot --run-id "$RUN_ID"

      - name: Capture Figma (Tiers 1–2)
        run: pnpm --filter @figit/oracle-harness run cli figma run --run-id "$RUN_ID"

      - name: Assemble report + step summary
        run: pnpm --filter @figit/oracle-harness run cli report --run-id "$RUN_ID" --commit "${{ github.sha }}"

      # Rolling history: restore the prior runs.ndjson, append this run's line,
      # re-upload. `history` also mirrors the line into the step summary.
      - name: Restore run history
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: oracle-history
          path: oracle/history

      - name: Append run history
        run: pnpm --filter @figit/oracle-harness run cli history --run-id "$RUN_ID"

      - name: Upload run history
        uses: actions/upload-artifact@v4
        with:
          name: oracle-history
          path: oracle/history/runs.ndjson
          retention-days: 90
          overwrite: true

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-run-${{ github.run_id }}
          path: oracle/runs/${{ env.RUN_ID }}
          retention-days: 14

  # ── Fix ──────────────────────────────────────────────────────────────────
  # Run the /fix-discrepancy agent against the report; it selects one class,
  # fixes the converter (or records a ledger note), self-checks with `cli guard`,
  # and opens a labelled PR. All committed-file changes land in that reviewed PR.
  fix:
    name: Fix top discrepancy
    needs: measure
    runs-on: ubuntu-latest
    environment: oracle
    env:
      RUN_ID: ${{ needs.measure.outputs.run_id }}
      # Bills against your Claude subscription (Pro/Max), not the metered API.
      # Generate once with `claude setup-token` locally, store as this secret.
      # To use pay-per-token API instead, swap this for:
      #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Fine-grained token (contents+PRs, this repo only) so the opened PR runs
      # normal CI. GITHUB_TOKEN would suppress downstream workflow triggers.
      GH_TOKEN: ${{ secrets.ORACLE_GH_TOKEN }}
      AGENT_MODEL: ${{ inputs.model || 'claude-opus-4-8' }}
      AGENT_MAX_TURNS: ${{ inputs.max_turns || '80' }}
    outputs:
      claude_auth: ${{ steps.fix.outputs.claude_auth }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # Full history so `cli guard` can diff against main and read merge-base.
          fetch-depth: 0
          token: ${{ secrets.ORACLE_GH_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm --filter @figit/dom-to-figma exec playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        run: pnpm --filter @figit/dom-to-figma exec playwright install chromium --with-deps

      - name: Download run report
        uses: actions/download-artifact@v4
        with:
          name: oracle-run-${{ github.run_id }}
          path: oracle/runs/${{ env.RUN_ID }}

      - name: Configure git identity
        run: |
          git config user.name "oracle-bot"
          git config user.email "oracle-bot@users.noreply.github.com"

      # Materialize cross-run memory: new classes become `open`, recurring ones
      # refresh, vanished ones resolve. Its file changes ride into the agent's PR.
      - name: Reconcile ledger
        run: pnpm --filter @figit/oracle-harness run cli ledger reconcile --run-id "$RUN_ID"

      # Ledger-aware selection already skips parked/cooled-down classes; `none`
      # means nothing is workable and the fix step is a successful no-op.
      - name: Select target class
        id: select
        run: |
          CLASS=$(pnpm --silent --filter @figit/oracle-harness run cli ledger select --run-id "$RUN_ID" | tail -n1 | tr -d '[:space:]')
          echo "class=$CLASS" >> "$GITHUB_OUTPUT"
          echo "Selected class: ${CLASS:-<none>}"

      - name: Install Claude Code
        if: steps.select.outputs.class != 'none' && steps.select.outputs.class != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Fix and open PR
        id: fix
        if: steps.select.outputs.class != 'none' && steps.select.outputs.class != ''
        run: |
          set +e
          claude -p "/fix-discrepancy oracle/runs/$RUN_ID/report.json" \
            --permission-mode acceptEdits \
            --max-turns "$AGENT_MAX_TURNS" \
            --model "$AGENT_MODEL" 2>&1 | tee /tmp/claude.log
          code=${PIPESTATUS[0]}
          # A failure whose output smells like auth is a token-expiry alert, not
          # an agent that merely couldn't fix the bug (that exits 0 with a note).
          if [ "$code" -ne 0 ] && grep -qiE 'oauth|setup-token|unauthor|authentication|invalid.?token|token.*expired|\b401\b' /tmp/claude.log; then
            echo "claude_auth=expired" >> "$GITHUB_OUTPUT"
            echo "::error title=Claude token expired::Run \`claude setup-token\` locally and update the CLAUDE_CODE_OAUTH_TOKEN secret."
          fi
          exit "$code"

      - name: Nothing to fix
        if: steps.select.outputs.class == 'none' || steps.select.outputs.class == ''
        run: echo "No workable discrepancy class this run — nothing to fix." >> "$GITHUB_STEP_SUMMARY"

  # ── Alert ─────────────────────────────────────────────────────────────────
  # On any run failure, open (or comment on) ONE deduplicated issue so a human
  # gets an email with exactly what to do — most often, refresh an expired
  # credential. Uses the default GITHUB_TOKEN (issue scope only); no PAT needed.
  alert:
    name: Alert on failure
    needs: [measure, fix]
    if: always() && (needs.measure.result == 'failure' || needs.fix.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FIGMA_AUTH: ${{ needs.measure.outputs.figma_auth }}
      CLAUDE_AUTH: ${{ needs.fix.outputs.claude_auth }}
    steps:
      - name: Open or update alert issue
        run: |
          reason="a scheduled Oracle run failed"
          action="Open the run and check which step failed."
          if [ "$FIGMA_AUTH" = "expired" ]; then
            reason="the Figma login session expired"
            action="Run \`pnpm --filter @figit/oracle-harness cli figma login\` locally, base64 the refreshed .figma-storage-state.json, and update the FIGMA_STORAGE_STATE secret in the \`oracle\` environment."
          elif [ "$CLAUDE_AUTH" = "expired" ]; then
            reason="the Claude Code OAuth token expired"
            action="Run \`claude setup-token\` locally and update the CLAUDE_CODE_OAUTH_TOKEN secret in the \`oracle\` environment."
          fi
          body=$(printf '**%s.**\n\n**What to do:** %s\n\n**Failed run:** %s\n\n_Opened automatically by the Oracle workflow; it will comment here on repeat failures rather than open new issues._' "$reason" "$action" "$RUN_URL")
          gh label create oracle-alert --repo "$REPO" --color B60205 --description "Oracle pipeline needs attention" 2>/dev/null || true
          existing=$(gh issue list --repo "$REPO" --label oracle-alert --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --label oracle-alert --title "🔴 Oracle: $reason" --body "$body"
          fi
